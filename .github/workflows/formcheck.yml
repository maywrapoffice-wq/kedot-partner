name: formcheck
on: push
permissions:
  contents: write
jobs:
  f:
    if: contains(github.event.head_commit.message, '[formcheck]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL "https://docs.google.com/forms/d/e/1FAIpQLScBwbItiUOAr9Sbn0hhCUy2zX_ApFcAP67Fk0u9vOXEAw5cZA/viewform" -o page.html
          python3 - <<'PY'
          import re,json
          s=open('page.html',encoding='utf-8').read()
          m=re.search(r'FB_PUBLIC_LOAD_DATA_ = (.*?);</script>',s,re.S)
          d=json.loads(m.group(1))
          out=[]
          for q in d[1][1]:
              try:
                  for e in q[4]:
                      out.append({'title':q[1],'entry':e[0],'required':e[2],'options':[o[0] for o in (e[1] or [])]})
              except Exception: pass
          json.dump(out,open('form-check.json','w'),ensure_ascii=False,indent=1)
          PY
          git config user.name bot; git config user.email bot@x
          git add form-check.json; git commit -m "form check result"; git push
